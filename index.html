<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes:
      - script-src 'self' only: the theme pre-init script lives in /theme-init.js
        (external) so 'unsafe-inline' is not needed; no dependency uses eval /
        new Function, so 'unsafe-eval' is dropped too.
      - style-src keeps 'unsafe-inline': React/Plotly set inline style
        attributes and the splash <style> block below is inline; style
        attributes are governed by style-src(-attr), so this must stay.
      - img-src/font-src allow data: for Plotly modebar icons, html-to-image
        rasterization and KaTeX fonts; blob: for worker (fitWorker) and
        export downloads.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none';" />
    <title>plot3d.xyz — Free Online 2D/3D Scientific Plotting & Curve Fitting</title>
    <meta name="description" content="Free browser-based scientific plotting tool. Create 2D/3D charts (line, scatter, surface, heatmap and more), fit curves, edit CSV/Excel data, and export publication-ready PNG/SVG/PDF figures. No sign-up required." />
    <meta name="keywords" content="online plotting, scientific charts, 3D surface plot, curve fitting, data visualization, scatter plot, heatmap, matplotlib alternative, research figures" />
    <link rel="canonical" href="https://plot3d.xyz/" />
    <meta name="msvalidate.01" content="8329543911F2854FB3BC19DEF862C15A" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plot3d.xyz/" />
    <meta property="og:title" content="plot3d.xyz — Free Online 2D/3D Scientific Plotting & Curve Fitting" />
    <meta property="og:description" content="Create publication-ready 2D/3D scientific charts, fit curves and edit data — all in your browser. No sign-up, no server upload." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="plot3d.xyz — Free Online 2D/3D Scientific Plotting & Curve Fitting" />
    <meta name="twitter:description" content="Create publication-ready 2D/3D scientific charts, fit curves and edit data — all in your browser. No sign-up, no server upload." />
    <script src="/theme-init.js"></script>
    <style>
      /* Splash shown until React mounts and removes #app-splash. Pure CSS so
         it works even when JS is slow to load. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #1a1a2e; /* matches dark theme --bg-base */
        color: #a1a1aa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        transition: opacity 200ms ease-out;
      }
      [data-theme="light"] #app-splash {
        background: #f8fafc;
        color: #475569;
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(148, 148, 170, 0.25);
        border-top-color: #38bdf8; /* matches --accent (dark) */
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      [data-theme="light"] #app-splash .spinner {
        border-color: rgba(15, 23, 42, 0.12);
        border-top-color: #0284c7; /* matches --accent (light) */
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      /* Reduced motion: stop the spinner animation */
      @media (prefers-reduced-motion: reduce) {
        #app-splash .spinner { animation: none; border-top-color: transparent; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
